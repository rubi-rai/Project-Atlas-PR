<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile - Project Atlas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 50px 20px;
        }
        .profile-card {
            max-width: 450px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px #00000015;
        }
        h1 {
            color: #243b64;
        }
        .role {
            color: #0d9488;
            font-weight: bold;
        }
        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }
        .skills span {
            background: #e4f5f2;
            padding: 8px 12px;
            border-radius: 6px;
        }
        a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #243b64;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <main class="profile-card">
        <h1>Rubi</h1>
        <p class="role">Junior Software Developer</p>
        <p>
            I am an MCA graduate interested in Java development,
            databases, and building useful software applications.
        </p>
        <h2>My Skills</h2>
        <div class="skills">
            <span>Java</span>
            <span>SQL</span>
            <span>HTML</span>
        </div>
        <a href="https://github.com/rubi-rai"
           target="_blank"
           rel="noopener noreferrer">View Portfolio</a>
    </main>
</body>
</html>
